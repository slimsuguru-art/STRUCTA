<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRUCTA — Nouveau mot de passe</title>
<meta name="description" content="Choisissez un nouveau mot de passe pour votre compte STRUCTA.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%233E63DD%27/%3E%3Cstop offset=%271%27 stop-color=%27%237C5CFC%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="atom-decor" aria-hidden="true">
  <svg viewBox="0 0 720 720">
    <ellipse cx="360" cy="360" rx="300" ry="118" fill="none" stroke="#2E6E8E" stroke-width="1" opacity="0.16" transform="rotate(0 360 360)"/>
    <ellipse cx="360" cy="360" rx="300" ry="118" fill="none" stroke="#C87F3F" stroke-width="1" opacity="0.14" transform="rotate(60 360 360)"/>
    <ellipse cx="360" cy="360" rx="300" ry="118" fill="none" stroke="#16283D" stroke-width="1" opacity="0.10" transform="rotate(120 360 360)"/>
    <circle cx="360" cy="360" r="5" fill="#16283D" opacity="0.35"/>
    <circle r="4" fill="#2E6E8E" opacity="0.6">
      <animateMotion dur="22s" repeatCount="indefinite" path="M360,360 m-300,0 a300,118 0 1,0 600,0 a300,118 0 1,0 -600,0"/>
    </circle>
    <circle r="3.5" fill="#C87F3F" opacity="0.55">
      <animateMotion dur="28s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M360,360 m-300,0 a300,118 0 1,0 600,0 a300,118 0 1,0 -600,0"/>
    </circle>
    <circle r="3.5" fill="#16283D" opacity="0.4">
      <animateMotion dur="34s" repeatCount="indefinite" path="M360,360 m-300,0 a300,118 0 1,0 600,0 a300,118 0 1,0 -600,0"/>
    </circle>
  </svg>
</div>

<div class="auth-center">

  <div class="auth-header fade-in-up">
    <a href="index.html" class="brand-mark">STRUCTA</a>
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un mot de passe pour votre compte.</p>
  </div>

  <div class="auth-card fade-in-up-delay">

    <div id="reset-invalid" class="alert alert-danger" style="display:none;">
      Ce lien n'est plus valide ou a expiré. Demandez un nouveau lien depuis la page de connexion.
    </div>

    <form id="reset-password-form">
      <div class="field password-field" id="reset-password-field">
        <label for="reset-password">Nouveau mot de passe</label>
        <input type="password" id="reset-password" placeholder="8 caractères minimum" autocomplete="new-password">
        <button type="button" class="password-toggle" onclick="togglePassword('reset-password', this)">Afficher</button>
        <span class="field-error">8 caractères minimum.</span>
      </div>

      <div class="field password-field" id="reset-password-confirm-field">
        <label for="reset-password-confirm">Confirmer le mot de passe</label>
        <input type="password" id="reset-password-confirm" placeholder="Retapez le mot de passe" autocomplete="new-password">
        <span class="field-error">Les mots de passe ne correspondent pas.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Mettre à jour le mot de passe</button>
    </form>

  </div>

  <p class="auth-footer fade-in-up-delay">Un produit Ognandji Labs</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
