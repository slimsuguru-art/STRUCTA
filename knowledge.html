<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRUCTA — Connaissances</title>
<meta name="description" content="Rôles, contacts et savoir-faire de votre entreprise.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%233E63DD%27/%3E%3Cstop offset=%271%27 stop-color=%27%237C5CFC%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="app">

<div id="page-loader" class="page-loader"><div class="spinner"></div></div>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
<div class="app-layout">

  <aside class="sidebar">
    <a href="dashboard.html" class="sidebar-brand">STRUCTA</a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <span class="sidebar-icon">▦</span> Tableau de bord
      </a>
      <a href="documents.html" class="sidebar-link">
        <span class="sidebar-icon">▤</span> Documents
      </a>
      <a href="procedures.html" class="sidebar-link">
        <span class="sidebar-icon">☑</span> Procédures
      </a>
      <a href="knowledge.html" class="sidebar-link is-active">
        <span class="sidebar-icon">◎</span> Connaissances
      </a>
      <a href="documents.html?category=Mod%C3%A8les" class="sidebar-link">
        <span class="sidebar-icon">▥</span> Modèles
      </a>
      <a href="team.html" class="sidebar-link">
        <span class="sidebar-icon">◈</span> Équipe
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="trust-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Données privées et sécurisées
      </span>
      <a href="#" class="sidebar-link" style="padding-left:0;" onclick="handleLogout(); return false;">
        <span class="sidebar-icon">◐</span> Se déconnecter
      </a>
    </div>
  </aside>

  <main class="app-main">

    <div class="app-header fade-in-up">
      <div style="display:flex; align-items:center; gap:10px;">
        <button type="button" class="mobile-nav-toggle" onclick="openSidebar()" aria-label="Menu">☰</button>
        <h1>Connaissances</h1>
      </div>
      <div class="app-search">
        <span>⌕</span>
        <input type="text" id="knowledge-search-input" placeholder="Rechercher">
      </div>
    </div>

    <div class="toolbar fade-in-up-delay" style="margin-bottom: var(--space-md);">
      <button type="button" class="btn btn-primary" onclick="openKnowledgeFormModal()">+ Nouvelle entrée</button>
    </div>

    <div id="knowledge-type-strip" class="category-strip fade-in-up-delay">
      <!-- Rempli par app.js -->
    </div>

    <div id="knowledge-list" class="know-list fade-in-up-delay">
      <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
    </div>

  </main>

</div>

<!-- Modale : créer / modifier une connaissance -->
<div id="knowledge-form-modal" class="modal-overlay">
  <div class="modal-box modal-box-wide">
    <h3 id="knowledge-form-title">Nouvelle entrée</h3>
    <p>Un rôle, un contact utile, ou une note sur le fonctionnement de l'entreprise.</p>
    <form id="knowledge-form">
      <input type="hidden" id="knowledge-id">

      <div class="field">
        <label for="knowledge-type">Type</label>
        <select id="knowledge-type">
          <option value="role">Rôle & responsabilité</option>
          <option value="contact">Contact utile</option>
          <option value="note" selected>Note libre</option>
        </select>
      </div>

      <div class="field" id="knowledge-title-field">
        <label for="knowledge-title">Titre</label>
        <input type="text" id="knowledge-title" placeholder="Ex : Responsable comptabilité">
        <span class="field-error">Champ requis.</span>
      </div>

      <div class="field">
        <label for="knowledge-content">Détails</label>
        <textarea id="knowledge-content" placeholder="Ex : Nom, téléphone, ce qu'il faut savoir..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModalById('knowledge-form-modal')">Annuler</button>
        <button type="submit" class="btn btn-primary" id="knowledge-form-submit">Créer</button>
      </div>
    </form>
  </div>
</div>

<!-- Modale : consulter une connaissance -->
<div id="knowledge-view-modal" class="modal-overlay">
  <div class="modal-box modal-box-wide">
    <h3 id="knowledge-view-title"></h3>
    <p id="knowledge-view-content" style="white-space: pre-wrap;"></p>
    <div class="modal-actions" style="margin-top: var(--space-lg);">
      <button type="button" class="btn btn-secondary" id="knowledge-delete-btn">Supprimer</button>
      <button type="button" class="btn btn-secondary" onclick="closeModalById('knowledge-view-modal')">Fermer</button>
      <button type="button" class="btn btn-primary" id="knowledge-edit-btn">Modifier</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
